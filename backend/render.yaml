services:
  - type: web
    name: livercare-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: livercare-postgres
          property: connectionString
      - key: AUTO_SQLITE_FALLBACK
        value: "false"
      - key: CORS_ORIGINS
        value: https://livercare-ai.vercel.app,http://localhost:5173

databases:
  - name: livercare-postgres
    plan: free
    databaseName: livercare_db
    user: livercare_user

